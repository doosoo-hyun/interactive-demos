<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC 회로 주파수별 응답 비교 (고조파 차수 설정)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-color: #2563eb;
            --border-color: #cbd5e1;
            --box-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        header {
            margin-bottom: 16px;
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 12px;
        }

        h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }
        p.subtitle { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

        .graph-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .graph-box {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
        }

        .graph-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 220px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            background-color: var(--box-bg);
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #cbd5e1;
            outline: none;
            accent-color: var(--accent-color);
        }

        .value-badge {
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            min-width: 85px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RC 회로 주파수별 응답 비교 (Low-Pass Filter)</h1>
        <p class="subtitle">입력 사각파 주파수 및 고조파 차수에 따른 커패시터 출력 전압 Vc(t) 필터링 비교</p>
    </header>

    <div class="graph-section">
        <!-- 상단: 저주파수 응답 -->
        <div class="graph-box">
            <div class="graph-title">
                <span>[위] 저주파수 기본파 응답 (충분한 충방전 구간)</span>
            </div>
            <div class="canvas-container">
                <canvas id="lowChart"></canvas>
            </div>
        </div>

        <!-- 하단: 고주파수 응답 -->
        <div class="graph-box">
            <div class="graph-title">
                <span>[아래] 고주파수 응답 (고조파 스위칭 - 필터링 쇄굴 파형)</span>
            </div>
            <div class="canvas-container">
                <canvas id="highChart"></canvas>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="tauSlider">
                <span>RC 시상수 (τ = RC)</span>
                <span id="tauVal" class="value-badge">τ = 1.0</span>
            </label>
            <div class="slider-container">
                <input type="range" id="tauSlider" min="0.2" max="3.0" step="0.1" value="1.0">
            </div>
        </div>

        <div class="control-group">
            <label for="freqMultSlider">
                <span>아래 그래프 고주파수 차수</span>
                <span id="freqMultVal" class="value-badge">3 차수 (3배)</span>
            </label>
            <div class="slider-container">
                <input type="range" id="freqMultSlider" min="3" max="21" step="2" value="3">
            </div>
        </div>
    </div>
</div>

<script>
    const ctxLow = document.getElementById('lowChart').getContext('2d');
    const ctxHigh = document.getElementById('highChart').getContext('2d');

    const tauSlider = document.getElementById('tauSlider');
    const freqMultSlider = document.getElementById('freqMultSlider');
    const tauVal = document.getElementById('tauVal');
    const freqMultVal = document.getElementById('freqMultVal');

    const leadPts = 20;
    const segPts = 100;
    const tailPts = 10;
    const totalPoints = leadPts + (segPts * 3) + tailPts;

    // 1. 저주파수 (상단 그래프)
    function generateLowData(tau) {
        const labels = [];
        const vinData = [];
        const vcData = [];

        let vc = 0;
        const dt = 1.5 / (segPts * 3);

        for (let i = 0; i <= totalPoints; i++) {
            if (i === leadPts) labels.push('0');
            else if (i === leadPts + segPts) labels.push('T / 2');
            else if (i === leadPts + segPts * 2) labels.push('T');
            else if (i === leadPts + segPts * 3) labels.push('3T / 2');
            else labels.push('');

            let vin = 0;
            if (i >= leadPts && i < leadPts + segPts) vin = 5;
            else if (i >= leadPts + segPts && i < leadPts + segPts * 2) vin = 0;
            else if (i >= leadPts + segPts * 2 && i <= leadPts + segPts * 3 + tailPts) vin = 5;

            vinData.push(vin);
            vc += ((vin - vc) / (tau * 0.3)) * dt;
            vcData.push(vc);
        }

        return { labels, vinData, vcData };
    }

    // 2. 고주파수 (하단 그래프 - 홀수 차수 3, 5, 7 ... 21)
    function generateHighData(tau, mult) {
        const labels = [];
        const vinData = [];
        const vcData = [];

        let vc = 0;
        const dt = 1.5 / (segPts * 3);
        const highSegPts = segPts / mult;

        for (let i = 0; i <= totalPoints; i++) {
            if (i === leadPts) labels.push('0');
            else if (i === leadPts + segPts * 2) labels.push('T');
            else labels.push('');

            let vin = 0;
            if (i >= leadPts && i <= leadPts + segPts * 3) {
                const elapsedPts = i - leadPts;
                const pulseIndex = Math.floor(elapsedPts / highSegPts);
                vin = (pulseIndex % 2 === 0) ? 5 : 0;
            } else if (i > leadPts + segPts * 3) {
                vin = 0;
            }

            vinData.push(vin);
            vc += ((vin - vc) / (tau * 0.3)) * dt;
            vcData.push(vc);
        }

        return { labels, vinData, vcData };
    }

    let tau = parseFloat(tauSlider.value);
    let mult = parseInt(freqMultSlider.value);

    let lowData = generateLowData(tau);
    let highData = generateHighData(tau, mult);

    // 상단 스케일
    const lowScaleOptions = {
        x: {
            grid: {
                color: (context) => {
                    const idx = context.index;
                    if (idx === leadPts || idx === leadPts + segPts || idx === leadPts + segPts * 2 || idx === leadPts + segPts * 3) {
                        return '#94a3b8';
                    }
                    return 'transparent';
                },
                lineWidth: 1.5
            },
            ticks: {
                color: '#0f172a',
                font: { size: 13, weight: 'bold' },
                maxRotation: 0,
                autoSkip: false
            }
        },
        y: {
            min: -0.5,
            max: 6.0,
            grid: { color: '#e2e8f0' },
            ticks: {
                color: '#0f172a',
                font: { size: 12, weight: 'bold' },
                callback: function(value) {
                    if (value === 0) return '0';
                    if (value === 5) return 'v_C';
                    return '';
                }
            }
        }
    };

    // 하단 스케일 (3/2T 라벨 제거 및 0, T 정렬)
    const highScaleOptions = {
        x: {
            grid: {
                color: (context) => {
                    const idx = context.index;
                    if (idx === leadPts || idx === leadPts + segPts * 2) {
                        return '#94a3b8';
                    }
                    return 'transparent';
                },
                lineWidth: 1.5
            },
            ticks: {
                color: '#0f172a',
                font: { size: 13, weight: 'bold' },
                maxRotation: 0,
                autoSkip: false
            }
        },
        y: {
            min: -0.5,
            max: 6.0,
            grid: { color: '#e2e8f0' },
            ticks: {
                color: '#0f172a',
                font: { size: 12, weight: 'bold' },
                callback: function(value) {
                    if (value === 0) return '0';
                    if (value === 5) return 'v_C';
                    return '';
                }
            }
        }
    };

    const chartLow = new Chart(ctxLow, {
        type: 'line',
        data: {
            labels: lowData.labels,
            datasets: [
                {
                    label: '입력 전압 Vin(t)',
                    data: lowData.vinData,
                    borderColor: '#dc2626',
                    borderDash: [5, 4],
                    borderWidth: 1.8,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: '출력 전압 Vc(t)',
                    data: lowData.vcData,
                    borderColor: '#2563eb',
                    borderWidth: 2.5,
                    pointRadius: 0,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: lowScaleOptions,
            plugins: {
                legend: { position: 'top', labels: { color: '#0f172a', font: { size: 12, weight: 'bold' }, boxWidth: 14 } }
            }
        }
    });

    const chartHigh = new Chart(ctxHigh, {
        type: 'line',
        data: {
            labels: highData.labels,
            datasets: [
                {
                    label: '입력 전압 Vin(t) (고주파수 스위칭)',
                    data: highData.vinData,
                    borderColor: '#dc2626',
                    borderDash: [4, 4],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: '출력 전압 Vc(t) (고주파 감쇠 반응)',
                    data: highData.vcData,
                    borderColor: '#2563eb',
                    borderWidth: 2.5,
                    pointRadius: 0,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: highScaleOptions,
            plugins: {
                legend: { position: 'top', labels: { color: '#0f172a', font: { size: 12, weight: 'bold' }, boxWidth: 14 } }
            }
        }
    });

    function updateCharts() {
        tauVal.textContent = `τ = ${tau.toFixed(1)}`;
        freqMultVal.textContent = `${mult} 차수 (${mult}배)`;

        const newLow = generateLowData(tau);
        const newHigh = generateHighData(tau, mult);

        chartLow.data.labels = newLow.labels;
        chartLow.data.datasets[0].data = newLow.vinData;
        chartLow.data.datasets[1].data = newLow.vcData;
        chartLow.update();

        chartHigh.data.labels = newHigh.labels;
        chartHigh.data.datasets[0].data = newHigh.vinData;
        chartHigh.data.datasets[1].data = newHigh.vcData;
        chartHigh.update();
    }

    tauSlider.addEventListener('input', (e) => {
        tau = parseFloat(e.target.value);
        updateCharts();
    });

    freqMultSlider.addEventListener('input', (e) => {
        mult = parseInt(e.target.value);
        updateCharts();
    });
</script>
</body>
</html>
