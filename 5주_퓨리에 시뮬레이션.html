<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사각파 푸리에 급수 시뮬레이터 (White Version)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #cbd5e1;
            --box-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .formula-box {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Times New Roman', serif;
            font-size: 1.25rem;
            color: #1d4ed8;
            font-weight: 600;
        }

        .formula-box i {
            font-family: inherit;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 380px;
            margin-bottom: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border-color);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            background-color: var(--box-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #cbd5e1;
            outline: none;
            accent-color: var(--accent-color);
        }

        .value-badge {
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            min-width: 32px;
            text-align: center;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .toggle-group span {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #64748b;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>사각파 푸리에 급수 시뮬레이터</h1>
        <p class="subtitle">개별 정현파(고주파수 홀수 배수)의 합을 통한 사각파 합성 및 시간 흐름 실시간 애니메이션</p>
    </header>

    <div class="formula-box">
        <i>f(t)</i> = <sup>4</sup>&frasl;<sub>&pi;</sub> &times; [ sin(&omega;t) + <sup>1</sup>&frasl;<sub>3</sub> sin(3&omega;t) + <sup>1</sup>&frasl;<sub>5</sub> sin(5&omega;t) + ... + <sup>1</sup>&frasl;<sub>N</sub> sin(N&omega;t) ]
    </div>

    <div class="canvas-container">
        <canvas id="fourierChart"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="harmonics">
                <span>최대 조화파 차수 (N)</span>
                <span id="harmonicsVal" class="value-badge">1</span>
            </label>
            <div class="slider-container">
                <input type="range" id="harmonics" min="1" max="49" step="2" value="1">
            </div>
        </div>

        <div class="control-group" style="justify-content: center;">
            <label class="toggle-group">
                <input type="checkbox" id="showComponents">
                <span>개별 조화파 성분 표시</span>
            </label>
            <label class="toggle-group" style="margin-top: 8px;">
                <input type="checkbox" id="showTarget" checked>
                <span>이상적인 사각파 가이드 표시</span>
            </label>
        </div>

        <div class="control-group" style="justify-content: center;">
            <div class="btn-group">
                <button id="playBtn" class="btn">시간 진행 정지</button>
                <button id="resetBtn" class="btn btn-secondary">리셋 (N=1)</button>
            </div>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('fourierChart').getContext('2d');
    const harmonicsSlider = document.getElementById('harmonics');
    const harmonicsVal = document.getElementById('harmonicsVal');
    const showComponentsCb = document.getElementById('showComponents');
    const showTargetCb = document.getElementById('showTarget');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');

    const numPoints = 300;
    let timeOffset = 0;
    let isTimeRunning = true;

    function getLabels() {
        const labels = [];
        for (let i = 0; i <= numPoints; i++) {
            labels.push('');
        }
        return labels;
    }

    function calculateData(N, time) {
        const composite = [];
        const components = {};
        const targetSquare = [];

        for (let k = 1; k <= N; k += 2) {
            components[k] = [];
        }

        for (let i = 0; i <= numPoints; i++) {
            const t = (i / numPoints) * 2 * Math.PI + time;
            
            const sinVal = Math.sin(t);
            targetSquare.push(sinVal >= 0 ? 1 : -1);

            let sum = 0;
            for (let k = 1; k <= N; k += 2) {
                const val = (4 / Math.PI) * (1 / k) * Math.sin(k * t);
                components[k].push(val);
                sum += val;
            }
            composite.push(sum);
        }

        return { composite, components, targetSquare };
    }

    let currentN = parseInt(harmonicsSlider.value);

    function buildDatasets(dataObj) {
        const datasets = [];

        if (showTargetCb.checked) {
            datasets.push({
                label: '이상적 사각파',
                data: dataObj.targetSquare,
                borderColor: '#dc2626',
                borderDash: [5, 4],
                borderWidth: 2,
                pointRadius: 0,
                fill: false
            });
        }

        datasets.push({
            label: `합성 파형 (N=${currentN})`,
            data: dataObj.composite,
            borderColor: '#2563eb',
            borderWidth: 2.5,
            pointRadius: 0,
            fill: false
        });

        if (showComponentsCb.checked) {
            Object.keys(dataObj.components).forEach(k => {
                datasets.push({
                    label: `${k}차 조화파`,
                    data: dataObj.components[k],
                    borderColor: `hsla(${(k * 45) % 360}, 65%, 45%, 0.5)`,
                    borderWidth: 1.2,
                    pointRadius: 0,
                    fill: false
                });
            });
        }

        return datasets;
    }

    const initialData = calculateData(currentN, timeOffset);

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: getLabels(),
            datasets: buildDatasets(initialData)
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: {
                    display: false
                },
                y: {
                    min: -1.5,
                    max: 1.5,
                    grid: { color: '#e2e8f0' },
                    ticks: { color: '#475569', font: { weight: 'bold' } }
                }
            },
            plugins: {
                legend: {
                    labels: { color: '#0f172a', font: { weight: 'bold' }, boxWidth: 14 }
                },
                tooltip: { enabled: false }
            }
        }
    });

    function animate() {
        if (isTimeRunning) {
            timeOffset += 0.03;
        }
        const dataObj = calculateData(currentN, timeOffset);
        chart.data.datasets = buildDatasets(dataObj);
        chart.update('none');
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    harmonicsSlider.addEventListener('input', (e) => {
        currentN = parseInt(e.target.value);
        harmonicsVal.textContent = currentN;
    });

    playBtn.addEventListener('click', () => {
        isTimeRunning = !isTimeRunning;
        playBtn.textContent = isTimeRunning ? '시간 진행 정지' : '시간 진행 재생';
    });

    resetBtn.addEventListener('click', () => {
        currentN = 1;
        harmonicsSlider.value = 1;
        harmonicsVal.textContent = 1;
        timeOffset = 0;
    });
</script>
</body>
</html>
